  <text x="70" y="145" class="subtitle">Une même technologie peut accélérer l’attaque comme la défense</text>
  <line x1="70" y1="185" x2="1530" y2="185" stroke="#28405f" stroke-width="2"/>
  <g>
      <rect x="70" y="240" width="450" height="230" rx="26" fill="#111c32" stroke="#ff6b6b" stroke-width="3"/>
      <circle cx="112" cy="285" r="18" fill="#ff6b6b"/>
      <text x="145" y="296" class="cardTitle">IA offensive</text>
