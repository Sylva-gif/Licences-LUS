    </g><g>
      <rect x="1080" y="240" width="450" height="230" rx="26" fill="#111c32" stroke="#ffbf69" stroke-width="3"/>
      <circle cx="1122" cy="285" r="18" fill="#ffbf69"/>
      <text x="1155" y="296" class="cardTitle">Evasion</text>
      <text x="1110" y="332" class="body">Exemples adversariaux</text><text x="1110" y="366" class="body">Contournement du modèle</text><text x="1110" y="400" class="body">Tests de robustesse</text>
    </g><g>
      <rect x="325" y="520" width="450" height="230" rx="26" fill="#111c32" stroke="#b388ff" stroke-width="3"/>
      <circle cx="367" cy="565" r="18" fill="#b388ff"/>
