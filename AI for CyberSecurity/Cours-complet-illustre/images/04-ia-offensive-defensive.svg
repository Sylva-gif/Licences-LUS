      .footer{font:600 20px Arial,sans-serif;fill:#8fa6c2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="18" height="900" fill="#20d3c2"/>
