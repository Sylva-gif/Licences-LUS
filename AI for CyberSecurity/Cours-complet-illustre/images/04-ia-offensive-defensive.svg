<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chapitre 4 · IA offensive, défensive &amp; résilience</title>
  <desc id="desc">Une même technologie peut accélérer l’attaque comme la défense</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#101b35"/>
    </linearGradient>
    <style>
      .title{font:700 54px Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:400 25px Arial,sans-serif;fill:#a9b8d0}
      .cardTitle{font:700 26px Arial,sans-serif;fill:#f8fafc}
