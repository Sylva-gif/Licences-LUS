    </g><g>
      <rect x="575" y="240" width="450" height="230" rx="26" fill="#111c32" stroke="#20d3c2" stroke-width="3"/>
      <circle cx="617" cy="285" r="18" fill="#20d3c2"/>
      <text x="650" y="296" class="cardTitle">IA défensive</text>
